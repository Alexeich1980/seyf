// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // RuStore SDK (Pay - оплата, App Update - обновления, 1.3.2) лежит в maven-репозитории RuStore,
        // не в mavenCentral. Единственный актуальный хост - nexus-external.rustore.ru (как в «Карте года»;
        // старый artifactory-external.vkpartner.ru перестал работать с 01.10.2026: appupdate с него не
        // скачивался, pay собирался только из кэша Gradle).
        maven { url 'https://nexus-external.rustore.ru/repository/maven-rustore-exposed' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
