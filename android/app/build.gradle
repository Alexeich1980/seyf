apply plugin: 'com.android.application'

// Ключ подписи релиза (стабильный, вне git): keys/seyf.jks + keys/seyf.properties.
// Без него собирается только отладка (build-apk.js запрещает debug-«релиз»). Наличие
// signingConfig обязательно: без него assembleRelease давал БЕЗ подписи APK — Android
// ставит такой с ошибкой «пакет повреждён». v1+v2+v3 включены явно (v2/v3 нужны Android 11+).
def keyProps = new Properties()
def keyPropsFile = rootProject.file('../keys/seyf.properties')
if (keyPropsFile.exists()) { keyProps.load(new FileInputStream(keyPropsFile)) }

android {
    namespace "ru.dorokhin.seyf"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        if (keyPropsFile.exists()) {
            release {
                storeFile rootProject.file('../keys/' + keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    defaultConfig {
        applicationId "ru.dorokhin.seyf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20603
        versionName "1.3.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Стор-сборка (build-apk.js --store передаёт -PseyfStore=true): MainActivity на старте
        // забывает путь к скачанной веб-сборке - код меняется только через RuStore (1.3.0).
        resValue "bool", "seyf_store", (project.findProperty('seyfStore') == 'true') ? 'true' : 'false'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Явно: релизный APK НЕ отлаживаемый (иначе по USB читается приватная папка с vault,
            // WebView-отладка и снимки экрана включены - см. MainActivity). Проверяется aapt2.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keyPropsFile.exists()) { signingConfig signingConfigs.release }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // RuStore Pay SDK — разовая покупка «полной версии» (см. RuStorePayPlugin.java).
    // BOM фиксирует согласованные версии модулей SDK; артефакт pay — платежи Pay SDK.
    // Тянется из maven RuStore (репозиторий добавлен в android/build.gradle).
    implementation platform('ru.rustore.sdk:bom:2026.08.01')
    implementation 'ru.rustore.sdk:pay'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
